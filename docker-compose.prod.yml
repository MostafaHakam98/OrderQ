# Production docker-compose file using pre-built images
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Secrets and host-specific values come from .env (never committed).
# Copy .env.example to .env and fill it in before the first start.

name: orderq

x-backend-env: &backend-env
  DEBUG: "False"
  DB_NAME: ${DB_NAME:-orderq}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
  DB_HOST: db
  DB_PORT: "5432"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  FLARESOLVERR_URL: http://flaresolverr:8191
  HIVE_URL: ${HIVE_URL:-}
  # Hive password logins (orders/backends.py) go to Hive's public URL. OrderQ is
  # not on Hive's Docker network, so the settings default
  # (http://orchestrator-backend:8000) does not resolve here.
  HIVE_API_URL: ${HIVE_API_URL:-${HIVE_URL:-}}
  SSO_ALLOWED_EMAIL_DOMAINS: ${SSO_ALLOWED_EMAIL_DOMAINS:-brightskiesinc.com}
  WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
  WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
  WEBPUSH_VAPID_CLAIMS_EMAIL: ${WEBPUSH_VAPID_CLAIMS_EMAIL:-admin@example.com}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-orderq}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: orderq-backend:${IMAGE_TAG:-latest}
    command: /app/start.sh
    restart: unless-stopped
    # No source bind-mount: the container runs the code baked into the image,
    # so a deploy is exactly what was built (media uploads live on a volume).
    volumes:
      - media_data:/app/media
    ports:
      - "19992:8000"
    environment:
      <<: *backend-env
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set in .env}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set in .env}
      USE_HTTPS: "True"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      flaresolverr:
        condition: service_started

  celery-worker:
    image: orderq-backend:${IMAGE_TAG:-latest}
    command: celery -A OrderQ worker --loglevel=info --concurrency=2
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: orderq-backend:${IMAGE_TAG:-latest}
    command: celery -A OrderQ beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info

  frontend:
    image: orderq-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  flutter-pwa:
    image: orderq-flutter-pwa:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx-router:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "19991:19991"
    volumes:
      - ./nginx-router.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - flutter-pwa
      - backend

volumes:
  postgres_data:
  redis_data:
  media_data:

# Only the stack's own default network. OrderQ used to join Hive's
# bsacaiportal_acai-network too, where Hive's Redis carries the alias "redis":
# REDIS_HOST and the Celery broker resolved to Hive's Redis instead of this
# stack's, and the queue filled it (2026-10-14). Traefik reaches OrderQ through
# the published port, so nothing here needs Hive's network.
